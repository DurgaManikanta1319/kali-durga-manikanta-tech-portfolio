<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#001a33" />
      <stop offset="70%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Neon Ring Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Chrome Metallic Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e8f0" />
      <stop offset="50%" stop-color="#7088a8" />
      <stop offset="65%" stop-color="#cadbe8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Electric Cyan-Blue Gradient -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0044cc" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGlow)" />

  <!-- Outer Neon Glow Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00d2ff" stroke-width="6" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />

  <!-- Monogram KM Shapes -->
  <g transform="translate(36, 40)">
    <!-- Letter K (Chrome & Blue Accents) -->
    <path d="M 60 90 L 105 90 L 105 290 L 60 290 Z" fill="url(#chromeGrad)" />
    <path d="M 105 185 L 205 90 L 250 90 L 140 195 L 255 290 L 205 290 L 105 205 Z" fill="url(#chromeGrad)" />
    <path d="M 60 210 L 105 210 L 60 290 Z" fill="url(#electricBlue)" filter="url(#neonGlow)" opacity="0.9" />

    <!-- Swoosh / Wave -->
    <path d="M 115 195 C 150 170 185 240 250 240 C 275 240 300 220 320 195 C 300 245 250 270 200 260 C 155 250 135 220 115 195 Z" fill="url(#electricBlue)" filter="url(#neonGlow)" />

    <!-- Letter M (Chrome & Neon Accents) -->
    <path d="M 230 90 L 275 90 L 320 200 L 365 90 L 410 90 L 410 290 L 375 290 L 375 145 L 330 255 L 310 255 L 265 145 L 265 290 L 230 290 Z" fill="url(#chromeGrad)" />
    <path d="M 365 90 L 410 90 L 410 210 L 375 290 Z" fill="url(#electricBlue)" opacity="0.8" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="380" font-family="'Inter', 'Montserrat', 'Arial', sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="7" text-anchor="middle">
    KALI <tspan fill="#00d2ff">DURGA</tspan> MANIKANTA
  </text>
  
  <!-- Subtle divider accent -->
  <line x1="140" y1="405" x2="235" y2="405" stroke="#00d2ff" stroke-width="1.5" opacity="0.6" />
  <polygon points="256,400 261,405 256,410 251,405" fill="#00d2ff" filter="url(#neonGlow)" />
  <line x1="277" y1="405" x2="372" y2="405" stroke="#00d2ff" stroke-width="1.5" opacity="0.6" />
</svg>